# Example Hermec server configuration.
# Every key is optional; the values shown for addr, channels and
# default_roles are the defaults. Unknown keys are rejected.
# Run with:  hermec-server -config example.server.toml
# Inspect the effective config with:  hermec-server -config ... -print-config
#
# Group settings (server_name, channels, voice_channels, max_voice, max_clients,
# max_per_ip, allowed_keys, roles, default_roles, history_days, history_mb,
# [grants]) seed the server's
# chain on first start. Once the chain exists they are ignored with a warning;
# to change them, edit them here and run:
#   hermec-server -config example.server.toml -apply-config
# which appends only the group keys this file sets, then exits. The password,
# addr, TLS and the other machine settings always come from this file.

# Listen address (host:port). ":7697" listens on all interfaces.
addr = ":7697"

# If set, every client must prove it knows this password (the password itself
# never goes over the network). Leave empty for none.
# password = "change-me"
# Better: store the key instead of the password. It is a 64-character hex
# string, scrypt(password, "hermec-pw\0" || server_id), and every host of the
# server must hold the same one. With only `password` set, the server derives
# the key at every start and logs a notice.
# password_key = ""

# Other hosts of this server, as ws:// or wss:// URLs. They are merged with the
# -hosts flag and with known_hosts.txt next to this file, which the host
# updates as it learns about other hosts. Use -advertise to say where clients
# reach this host, and -name for the name shown as "hosted by".
# known_hosts = ["ws://100.64.0.9:7697/"]

# Only these key fingerprints may connect. Empty or omitted = open server.
# allowed_keys = ["k7mv-q3xp-9dfw-02hj"]

# Static channel names.
channels = ["general"]

# Static voice channel names.
voice_channels = ["voice"]

# TLS: set both to serve wss://, or neither for plain ws://.
# tls_cert = "/etc/hermec/cert.pem"
# tls_key  = "/etc/hermec/key.pem"

# Voice: public IP to advertise for media on an internet-facing host (NAT 1:1); omit on a LAN.
# public_ip = "203.0.113.7"

# Media: all WebRTC media uses ONE UDP port, by default the same number as the
# listen port (7697 -> UDP 7697). Set this to use a different one (0 = default).
# media_port = 0

# Voice (legacy): restrict media to this UDP port range instead of the single
# port above; when set it takes precedence. Both or neither.
# udp_port_min = 50000
# udp_port_max = 50100

# Message rate limiting: messages per second sustained rate and burst bucket size.
# Either being 0 disables all rate limiting. Defaults: 30 sustained, 60 burst.
# msg_rate = 30
# msg_burst = 60

# Most participants in one voice channel; a further voice_join is refused with
# "voice_full". Default 25.
# Maximum 50 (larger rooms would overflow the signaling message size limit).
# max_voice = 25

# Most authenticated sessions at once; a further client is refused with
# "server_full". Default 256. (Also fixed: 64 connections awaiting auth,
# and an IP is refused for a growing time after 5 failed logins in a minute.)
# max_clients = 256

# Most simultaneous connections from one remote IP (default 16). Raise it for a
# LAN party or an office behind one NAT address.
# max_per_ip = 16

# LAN discovery: answer UDP probes on the same port number as addr (default true).
# Set false to bind no UDP discovery socket at all.
# discoverable = true

# Name shown in discovery replies, at most 64 characters (default: the listen host:port).
# server_name = "My Hermec Server"

# Chat history for text channels. Messages older than history_days are dropped
# (default 30; 0 keeps nothing and deletes the file; at most 3650). The oldest
# messages are dropped as soon as the stored chat passes history_mb megabytes
# (default 8; 1 to 64); the file itself is rewritten once it reaches twice
# that. The host also trims at start, every hour, and when these change.
# The file is chosen with the -history flag (default history.jsonl next to
# the -config file), as -key and -chain choose the key and chain files.
# history_days = 30
# history_mb = 8

# Roles given to fingerprints that have no entry in [grants].
default_roles = ["user"]

# Role definitions. The builtin roles (admin, user, bot) always exist;
# entries here add new roles or replace a builtin role's permissions.
# Permissions: join_channel, send_chat, manage.
[roles]
# listener = ["join_channel"]

# Fingerprint -> roles.
[grants]
# "k7mv-q3xp-9dfw-02hj" = ["admin"]
