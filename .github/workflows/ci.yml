name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The [D] keeps this line from matching its own workflow file.
      - name: No private keys in the tree
        run: |
          if git grep -l "BEGIN HERMEC ED25519 SEE[D]"; then
            echo "tracked file contains a HERMEC private key" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  test-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - run: go vet ./...
      - run: go test ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./core/proto -run='^$' -fuzz=FuzzDecode -fuzztime=60s
      - run: go test ./core/chain -run='^$' -fuzz=FuzzFromEntries -fuzztime=60s

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # audio, ui and cmd/hermec need cgo (malgo); the release workflow builds them natively.
      - name: Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./client ./cmd/hermec-icon ./cmd/hermec-server ./core/identity ./core/proto ./core/roles ./discover ./server ./ui/icon ./ui/state ./ui/theme ./update ./version
      - name: Linux arm64 (Raspberry Pi)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./client ./cmd/hermec-icon ./cmd/hermec-server ./core/identity ./core/proto ./core/roles ./discover ./server ./ui/icon ./ui/state ./ui/theme ./update ./version
