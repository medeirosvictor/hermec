name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev libopus-dev libopusfile-dev pkg-config
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go test ./core/proto -run='^$' -fuzz=FuzzDecode -fuzztime=60s

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      # audio, ui and cmd/hermec need cgo (libopus); the release workflow builds them natively.
      - name: Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./client ./cmd/hermec-icon ./cmd/hermec-server ./core/identity ./core/proto ./core/roles ./discover ./server ./ui/icon ./ui/state ./ui/theme ./update ./version
      - name: Linux arm64 (Raspberry Pi)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./client ./cmd/hermec-icon ./cmd/hermec-server ./core/identity ./core/proto ./core/roles ./discover ./server ./ui/icon ./ui/state ./ui/theme ./update ./version
