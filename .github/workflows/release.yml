name: release

# Builds and publishes release artifacts when a v* tag is pushed. On pull
# requests the same build and checks run as a dry run (TAG=dev-pr), but
# nothing is published.
#
# On tag pushes the gate job first requires the tagged commit to be on main
# and vet/tests to pass; publish needs it.
#
# Client assets (one native runner each):
#   hermec-windows-amd64.zip    windows-latest     MSYS2 UCRT64 gcc
#   hermec-windows-arm64.zip    windows-11-arm     MSYS2 CLANGARM64 clang
#   hermec-linux-amd64.tar.gz   ubuntu-22.04       system gcc
#   hermec-linux-arm64.tar.gz   ubuntu-22.04-arm   system gcc
#
# Clean-machine caveat: runners have toolchains installed, so the checks here
# (objdump / ldd allowlists, -version smoke run) are the proof that a binary
# does not depend on them; a friend's machine is the final gate.

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # Reaches shell steps only through the environment, never via ${{ }} inside
  # a run: script.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-pr' }}

jobs:
  gate:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - run: go vet ./...
      - run: go test ./...

  client:
    name: client ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: hermec-windows-amd64.zip
            bin: hermec.exe
            msystem: UCRT64
            msys-dir: ucrt64
            msys-packages: mingw-w64-ucrt-x86_64-gcc
            cc: gcc
            objdump: objdump
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            asset: hermec-windows-arm64.zip
            bin: hermec.exe
            msystem: CLANGARM64
            msys-dir: clangarm64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-lld
              mingw-w64-clang-aarch64-llvm
            cc: clang
            objdump: llvm-objdump
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            asset: hermec-linux-amd64.tar.gz
            bin: hermec
            cc: gcc
          - os: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            asset: hermec-linux-arm64.tar.gz
            bin: hermec
            cc: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid tag '$TAG': must match ^v[0-9A-Za-z.+-]+$" >&2
            exit 1
          fi

      - name: Install Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Build headers (same set as ci.yml) plus the runtime libraries
          # needed to start the binary for the -version check.
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev \
            libgl1 libx11-6 libxrandr2 libxcursor1 libxinerama1 libxi6 libxxf86vm1

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.msys-packages }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Put MSYS2 toolchain on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOC: ${{ steps.msys2.outputs.msys2-location }}
          MSYS_DIR: ${{ matrix.msys-dir }}
        run: |
          $bin = Join-Path (Join-Path $env:MSYS2_LOC $env:MSYS_DIR) 'bin'
          if (-not (Test-Path $bin)) { throw "MSYS2 bin dir not found: $bin" }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build client
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          BIN: ${{ matrix.bin }}
        run: |
          ldflags="-s -w -X github.com/medeirosvictor/hermec/version.Version=$TAG"
          if [ "$GOOS" = windows ]; then
            ldflags="$ldflags -extldflags=-static"
          fi
          go build -trimpath -ldflags "$ldflags" -o "$BIN" ./cmd/hermec

      - name: Check version stamp
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          got="$("./$BIN" -version)"
          echo "got: $got"
          if [ "$got" != "hermec $TAG" ]; then
            echo "expected 'hermec $TAG'" >&2
            exit 1
          fi

      - name: Check Windows imports (no MSYS2 DLLs)
        if: runner.os == 'Windows'
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
          OBJDUMP: ${{ matrix.objdump }}
          MSYS2_LOC: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          dlls="$("$OBJDUMP" -p "$BIN" | sed -n 's/.*DLL Name: *//p' | tr -d '\r')"
          echo "imports:"
          echo "$dlls"
          if [ -z "$dlls" ]; then
            echo "no imports found; objdump output unusable" >&2
            exit 1
          fi
          fail=0
          while IFS= read -r dll; do
            [ -n "$dll" ] || continue
            hit="$(find "$(cygpath -u "$MSYS2_LOC")" -iname "$dll" -print -quit 2>/dev/null)"
            if [ -n "$hit" ]; then
              echo "FAIL: $dll resolves to $hit" >&2
              fail=1
            fi
          done <<< "$dlls"
          exit $fail

      - name: Check Linux shared libraries
        if: runner.os == 'Linux'
        env:
          BIN: ${{ matrix.bin }}
        run: |
          ldd "./$BIN"
          bad="$(ldd "./$BIN" | grep -Ev 'linux-vdso|ld-linux|libc\.so|libm\.so|libpthread|libdl|libresolv|librt' || true)"
          if [ -n "$bad" ]; then
            echo "unexpected shared library dependencies:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Write README
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir stage
          {
            echo "HERMEC $TAG - voice and chat for small groups."
            echo "Use headphones (no echo cancellation yet)."
            if [ "$GOOS" = windows ]; then
              echo 'Windows SmartScreen may warn about an unknown publisher: click "More info", then "Run anyway".'
              echo 'If Windows Firewall asks, choose "Allow".'
            else
              echo "Needs a desktop with X11 or Wayland and PulseAudio or PipeWire."
            fi
          } > stage/README.txt
          if [ "$GOOS" = windows ]; then
            sed -i 's/$/\r/' stage/README.txt
          fi

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        run: |
          Copy-Item $env:BIN stage/
          Compress-Archive -Path stage/* -DestinationPath $env:ASSET
          if (-not (Test-Path $env:ASSET)) { throw "missing $env:ASSET" }

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        env:
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        run: |
          install -m 755 "$BIN" stage/hermec
          tar -czf "$ASSET" -C stage hermec README.txt
          tar -tzvf "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid tag '$TAG': must match ^v[0-9A-Za-z.+-]+$" >&2
            exit 1
          fi
      # Pure Go, no DLLs; same ldflags stamp as the client.
      - name: Build servers
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            ext=""; [ "$goos" = windows ] && ext=".exe"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/medeirosvictor/hermec/version.Version=$TAG" \
              -o "dist/hermec-server-$goos-$goarch$ext" ./cmd/hermec-server
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Combined checksums
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          # A hyphen in the tag (v0.1.0-rc1) marks a prerelease.
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes $flags artifacts/*
